name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install libpqxx (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpqxx-dev pkg-config

      - name: Install libpqxx (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq libpqxx pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix libpqxx)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install libpqxx (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libpqxx:x64-windows
          choco install pkgconfiglite -y --no-progress
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          Get-ChildItem "$root/lib/pkgconfig"
          "PKG_CONFIG_PATH=$root/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Package with CPack
        run: cpack -C Release --config CPackConfig.cmake
        working-directory: build

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            build/PragmaOnce-*.tar.gz
            build/PragmaOnce-*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*